<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">

  <link rel="stylesheet" href="./style.css">
</head>

<body>


  <div class="card">


    <i class="fa-regular fa-square square-icon"></i>
    <i class="fa-regular fa-circle circle-icon"></i>
    <i class="fa-regular fa-star star-icon"></i>

    <p class="heading">AIRMAX</p>


    <div class="card-content">
      <p class="name">Airmax</p>
      <i class="fa-solid fa-magnifying-glass nav-icon"></i>
      <i class="fa-solid fa-user nav-icon"></i>
      <i class="fa-solid fa-cart-shopping nav-icon"></i>

      <!-- CONTENT -->
      <p class="product-category">Winter Collection</p>
      <p class="product-title">Men Black Sneakers</p>
      <p class="product-price"> $150 </p>
      <p class="product-price price-2"> $200 </p>
      <p class="product-size"> SIZE 7 8 9 10 11 </p>
      <p class="product-color"> COLOR
        <i class="fa-solid fa-circle color-shades"></i>
        <i class="fa-solid fa-circle color-shades shade-no-2"></i>
        <i class="fa-solid fa-circle color-shades shade-no-3"></i>
      </p>

      <i class="fa-solid fa-bag-shopping product-actions"></i>
      <span class="btn-1">Buy Now</span>

      <i class="fa-solid fa-cart-shopping product-actions product-action-2"></i>
      <span class="btn-2">Add to Cart</span>


      <div class="product-banner">
        <img class="shoe-img" src="./assets/shoe-img.png" alt="shoe-img">
      </div>

    </div>


  </div>


</body>

</html>
